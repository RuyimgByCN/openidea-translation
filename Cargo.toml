[package]
name = "openidea-translation"
version = "0.1.0"
edition = "2024"
description = "YiiGuxing TranslationPlugin-style translation, AI dictionary, TTS pronunciation, inline doc annotations, and Word Book plugin for OpenIDEA"
license = "Apache-2.0"
publish = false

# Standalone plugin built outside any IDE workspace (`wasm32-wasip2`).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.50" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "unicode", "perf-dfa", "perf-onepass", "perf-backtrack", "perf-inline"] }
base64 = "0.22"
hex = "0.4"
md-5 = "0.11"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
